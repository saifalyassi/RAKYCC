<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sustainability icon">
  <title>سلوك مستدام</title>
  <rect width="64" height="64" rx="12" fill="none"/>
  <!-- globe circle: use currentColor with low opacity to allow tinting -->
  <circle cx="32" cy="28" r="18" fill="currentColor" fill-opacity="0.18"/>
  <!-- land shapes: slightly stronger currentColor layer to appear as 'green' when tinting -->
  <path d="M24 22c4-4 10-4 14-2 2 1 4 3 4 5 0 1-2 2-3 2-3 0-8-1-12 1-3 1-5 3-7 2-1-1-1-6 4-8z" fill="currentColor" fill-opacity="0.32" />
  <!-- leaf at bottom: bolder currentColor usage for visibility -->
  <path d="M44 38c-2 2-5 4-8 5-1 0-2 0-3-1 0 2-1 4-1 6 0 1 1 2 2 2 3 0 6-2 9-5 3-3 4-6 1-7z" fill="currentColor" fill-opacity="0.52" />
  <!-- ring outline: stroked with currentColor for tinting, keep thin -->
  <circle cx="32" cy="28" r="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.9"/>
  <!-- subtle inner stroke: very low opacity for soft edge -->
  <circle cx="32" cy="28" r="18" fill="none" stroke="currentColor" stroke-opacity="0.06" stroke-width="2"/>
</svg>
